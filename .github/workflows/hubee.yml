# hubee-0.0.3.yml
# github.com/shenjuexiao
# 20261018

# .github/workflows/hubee.yml
# GitHub 仓库自动推送 Gitee 仓库的工作流
# 适用不同用户名、不同仓库、仓库私有或开源
#
# 使用说明：在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加
# - GITEE_ORG       : 可选，Gitee 组织名，优先于 GITEE_USERNAME
# - GITEE_USERNAME  : 可选，Gitee 用户名，仅当 GITEE_ORG 不存在时生效
# - GITEE_TOKEN     : 必填，Gitee 私人令牌（需勾选 projects 权限）
# - GITEE_REPO      : 可选，Gitee 目标仓库名，默认与 GitHub 仓库同名，不存在则自动新建
# - GITEE_PRIVATE   : 可选，Gitee 仓库可见性（true 私有 / false 开源），默认与 GitHub 仓库一致
#
# 支持场景：
# - GitHub 组织 → Gitee 组织
# - GitHub 组织 → Gitee 个人
# - GitHub 个人 → Gitee 个人
# - GitHub 个人 → Gitee 组织

name: hubee

on:
  push:
    branches: [main, master]
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动同步
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync to Gitee
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target variables
        id: vars
        run: |
          # ---------- 判断 GitHub 仓库类型 ----------
          # 组织仓库：github.repository_owner_type == Organization
          GITHUB_OWNER_TYPE="${{ github.event.repository.owner.type }}"
          echo "GitHub 仓库所有者类型：${GITHUB_OWNER_TYPE}"

          # ---------- Gitee 组织名（可选） ----------
          GITEE_ORG="${{ secrets.GITEE_ORG }}"

          # ---------- Gitee 用户名 ----------
          GITEE_USERNAME="${{ secrets.GITEE_USERNAME }}"

          # ---------- 目标命名空间解析 ----------
          # 优先级：GITEE_ORG > GITEE_USERNAME > GitHub 所有者
          if [ -n "$GITEE_ORG" ]; then
            GITEE_NAMESPACE="$GITEE_ORG"
            GITEE_TARGET_TYPE="org"
          elif [ -n "$GITEE_USERNAME" ]; then
            GITEE_NAMESPACE="$GITEE_USERNAME"
            GITEE_TARGET_TYPE="user"
          else
            # 均未配置时，按 GitHub 所有者名作为 Gitee 用户名
            # （组织仓库同样回退到 GitHub 组织名，作为 Gitee 用户名使用）
            GITEE_NAMESPACE="${{ github.repository_owner }}"
            GITEE_TARGET_TYPE="user"
          fi

          # ---------- Gitee 仓库名 ----------
          GITEE_REPO="${{ secrets.GITEE_REPO }}"
          if [ -z "$GITEE_REPO" ]; then
            GITEE_REPO="${{ github.event.repository.name }}"
          fi

          # ---------- Gitee 仓库可见性 ----------
          # 默认与 GitHub 仓库一致：GitHub 私有 → true，GitHub 开源 → false
          # 个人仓库（GITEE_TARGET_TYPE=user）不读取 Secret，固定私有
          if [ "$GITEE_TARGET_TYPE" = "user" ] && [ -z "$GITEE_ORG" ]; then
            # 个人仓库默认私有，且不可通过 Secret 设置为开源
            GITEE_PRIVATE="true"
          else
            GITEE_PRIVATE="${{ secrets.GITEE_PRIVATE }}"
            if [ -z "$GITEE_PRIVATE" ]; then
              if [ "${{ github.event.repository.private }}" = "true" ]; then
                GITEE_PRIVATE="true"
              else
                GITEE_PRIVATE="false"
              fi
            fi
          fi

          # 归一化
          GITEE_PRIVATE="$(echo "$GITEE_PRIVATE" | tr '[:upper:]' '[:lower:]')"
          case "$GITEE_PRIVATE" in
            true|1|yes)  GITEE_PRIVATE="true"  ;;
            false|0|no)  GITEE_PRIVATE="false" ;;
            *)
              echo "::warning::GITEE_PRIVATE='$GITEE_PRIVATE' 无法识别，回退为 true"
              GITEE_PRIVATE="true"
              ;;
          esac

          echo "gitee_namespace=$GITEE_NAMESPACE"     >> "$GITHUB_OUTPUT"
          echo "gitee_target_type=$GITEE_TARGET_TYPE" >> "$GITHUB_OUTPUT"
          echo "gitee_repo=$GITEE_REPO"               >> "$GITHUB_OUTPUT"
          echo "gitee_private=$GITEE_PRIVATE"         >> "$GITHUB_OUTPUT"
          echo "github_owner_type=$GITHUB_OWNER_TYPE" >> "$GITHUB_OUTPUT"

          echo "::notice::GitHub(${GITHUB_OWNER_TYPE}) → Gitee(${GITEE_TARGET_TYPE}): ${GITEE_NAMESPACE}/${GITEE_REPO} (private=${GITEE_PRIVATE})"

      - name: Ensure Gitee repository exists
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          GITEE_NAMESPACE="${{ steps.vars.outputs.gitee_namespace }}"
          GITEE_TARGET_TYPE="${{ steps.vars.outputs.gitee_target_type }}"
          GITEE_REPO="${{ steps.vars.outputs.gitee_repo }}"
          GITEE_PRIVATE="${{ steps.vars.outputs.gitee_private }}"

          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 GITEE_TOKEN，请在仓库 Secrets 中配置"
            exit 1
          fi

          API="https://gitee.com/api/v5"
          REPO_API="${API}/repos/${GITEE_NAMESPACE}/${GITEE_REPO}"

          # 查询仓库是否存在
          HTTP_CODE=$(curl -s -o /tmp/repo.json -w "%{http_code}" \
            "${REPO_API}?access_token=${GITEE_TOKEN}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "::notice::Gitee 仓库已存在：${GITEE_NAMESPACE}/${GITEE_REPO}"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "::notice::Gitee 仓库不存在，正在创建：${GITEE_NAMESPACE}/${GITEE_REPO}"

            if [ "$GITEE_TARGET_TYPE" = "org" ]; then
              # 组织仓库：POST /orgs/{org}/repos
              CREATE_URL="${API}/orgs/${GITEE_NAMESPACE}/repos"
            else
              # 个人仓库：POST /user/repos
              CREATE_URL="${API}/user/repos"
            fi

            CREATE_CODE=$(curl -s -o /tmp/create.json -w "%{http_code}" \
              -X POST "${CREATE_URL}" \
              -H "Content-Type: application/json" \
              -d "{
                \"access_token\": \"${GITEE_TOKEN}\",
                \"name\": \"${GITEE_REPO}\",
                \"private\": ${GITEE_PRIVATE},
                \"auto_init\": false,
                \"has_issues\": true,
                \"has_wiki\": false
              }")

            if [ "$CREATE_CODE" = "201" ] || [ "$CREATE_CODE" = "200" ]; then
              echo "::notice::Gitee 仓库创建成功"
            else
              echo "::error::创建 Gitee 仓库失败（HTTP ${CREATE_CODE}）"
              cat /tmp/create.json
              exit 1
            fi
          else
            echo "::error::查询 Gitee 仓库失败（HTTP ${HTTP_CODE}）"
            cat /tmp/repo.json
            exit 1
          fi

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          GITEE_NAMESPACE="${{ steps.vars.outputs.gitee_namespace }}"
          GITEE_REPO="${{ steps.vars.outputs.gitee_repo }}"

          # 配置 Git 身份
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 推送统一使用 oauth2 作为固定用户名（个人 / 组织仓库通用）
          REMOTE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_NAMESPACE}/${GITEE_REPO}.git"

          if git remote | grep -qx gitee; then
            git remote set-url gitee "$REMOTE_URL"
          else
            git remote add gitee "$REMOTE_URL"
          fi

          # 镜像推送所有分支与标签（强制覆盖，与 GitHub 保持一致）
          git push --prune --force gitee \
            "refs/remotes/origin/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"

          echo "::notice::已成功同步到 https://gitee.com/${GITEE_NAMESPACE}/${GITEE_REPO}"
