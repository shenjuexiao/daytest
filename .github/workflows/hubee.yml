# hubee-0.0.2.yml
# github.com/shenjuexiao
# 20261017

# .github/workflows/hubee.yml
# GitHub 仓库自动推送 Gitee 仓库的工作流
# 适用不同用户名、不同仓库、私有库或公开库
#
# 使用说明：
# 1. 在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加：
# - GITEE_USERNAME : Gitee 用户名（可选，默认与 GitHub 同名）
# - GITEE_TOKEN    : Gitee 私人令牌（必填，需勾选 projects 权限）
# - GITEE_REPO     : Gitee 目标仓库名（可选，默认与 GitHub 同名；不存在则自动新建）
# 2. 触发方式：push 到默认分支、手动触发、定时同步

name: hubee

on:
  push:
    branches: [main, master]
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动同步
    - cron: '0 2 * * *'
  # 支持手动触发
  workflow_dispatch:

# 防止定时任务与 push 同时触发造成并发推送冲突
concurrency:
  group: hubee-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to Gitee
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          # 拉取全部历史与标签，保证镜像完整
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve target variables
        id: vars
        run: |
          # Gitee 用户名：优先使用 Secret，否则用 GitHub 仓库所有者
          # 使用内置环境变量，兼容 push / schedule / workflow_dispatch
          GITEE_USERNAME="${{ secrets.GITEE_USERNAME }}"
          if [ -z "$GITEE_USERNAME" ]; then
            GITEE_USERNAME="${GITHUB_REPOSITORY_OWNER}"
          fi

          # Gitee 仓库名：优先使用 Secret，否则用 GitHub 仓库名
          # GITHUB_REPOSITORY 形如 owner/repo，去掉 owner/ 即仓库名
          GITEE_REPO="${{ secrets.GITEE_REPO }}"
          if [ -z "$GITEE_REPO" ]; then
            GITEE_REPO="${GITHUB_REPOSITORY#*/}"
          fi

          # 仓库可见性：GitHub 私有 → Gitee 私有，否则公开
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            GITEE_PRIVATE="true"
          else
            GITEE_PRIVATE="false"
          fi

          {
            echo "gitee_username=$GITEE_USERNAME"
            echo "gitee_repo=$GITEE_REPO"
            echo "gitee_private=$GITEE_PRIVATE"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::将同步到 Gitee: $GITEE_USERNAME/$GITEE_REPO (private=$GITEE_PRIVATE)"

      - name: Ensure Gitee repository exists
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          GITEE_USERNAME="${{ steps.vars.outputs.gitee_username }}"
          GITEE_REPO="${{ steps.vars.outputs.gitee_repo }}"
          GITEE_PRIVATE="${{ steps.vars.outputs.gitee_private }}"

          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 GITEE_TOKEN，请在仓库 Secrets 中配置"
            exit 1
          fi

          API="https://gitee.com/api/v5"
          REPO_API="${API}/repos/${GITEE_USERNAME}/${GITEE_REPO}"

          # 查询仓库是否存在
          HTTP_CODE=$(curl -s -o /tmp/repo.json -w "%{http_code}" \
            "${REPO_API}?access_token=${GITEE_TOKEN}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "::notice::Gitee 仓库已存在：${GITEE_USERNAME}/${GITEE_REPO}"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "::notice::Gitee 仓库不存在，正在创建：${GITEE_USERNAME}/${GITEE_REPO}"

            CREATE_CODE=$(curl -s -o /tmp/create.json -w "%{http_code}" \
              -X POST "${API}/user/repos" \
              -H "Content-Type: application/json" \
              -d "{
                \"access_token\": \"${GITEE_TOKEN}\",
                \"name\": \"${GITEE_REPO}\",
                \"private\": ${GITEE_PRIVATE},
                \"auto_init\": false,
                \"has_issues\": true,
                \"has_wiki\": false
              }")

            if [ "$CREATE_CODE" = "201" ] || [ "$CREATE_CODE" = "200" ]; then
              echo "::notice::Gitee 仓库创建成功"
            else
              echo "::error::创建 Gitee 仓库失败（HTTP ${CREATE_CODE}）"
              cat /tmp/create.json
              exit 1
            fi
          else
            echo "::error::查询 Gitee 仓库失败（HTTP ${HTTP_CODE}）"
            cat /tmp/repo.json
            exit 1
          fi

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          GITEE_USERNAME="${{ steps.vars.outputs.gitee_username }}"
          GITEE_REPO="${{ steps.vars.outputs.gitee_repo }}"

          # 配置 Git 身份
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 使用 token 拼接远程地址（用户名密码方式，兼容公开/私有仓库）
          REMOTE_URL="https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_USERNAME}/${GITEE_REPO}.git"

          # 添加或更新 gitee 远程
          if git remote | grep -qx gitee; then
            git remote set-url gitee "$REMOTE_URL"
          else
            git remote add gitee "$REMOTE_URL"
          fi

          # 以镜像方式推送所有分支与标签（强制覆盖，保证与 GitHub 一致）
          # --prune 删除 Gitee 上多余的分支，--force 强制覆盖
          git push --prune --force gitee \
            "refs/remotes/origin/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"

          echo "::notice::已成功同步到 https://gitee.com/${GITEE_USERNAME}/${GITEE_REPO}"

          # 推送完成后移除含 token 的 remote，避免泄露
          git remote remove gitee || true
